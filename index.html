<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Brickfall</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device">
  <div class="bezel">
    <div class="bezel-top">
      <span class="led" id="led"></span>
      <span class="bezel-label">LCD · BRICK SYSTEM</span>
    </div>
    <div class="screen">
      <canvas id="screen" aria-label="Игровой экран"></canvas>
    </div>
  </div>

  <div class="brand">BRICKFALL</div>

  <div class="controls">
    <div class="dpad" id="dpad" aria-label="Крестовина">
      <span class="arm up"></span>
      <span class="arm down"></span>
      <span class="arm left"></span>
      <span class="arm right"></span>
      <span class="hub"></span>
    </div>
    <div class="action">
      <button class="btn-a" data-key="a" aria-label="Поворот">↻</button>
      <span class="btn-label">ПОВОРОТ</span>
    </div>
  </div>

  <div class="pills">
    <div class="pill-wrap">
      <button class="pill" data-key="sound" id="soundBtn" aria-label="Звук"></button>
      <span>ЗВУК</span>
    </div>
    <div class="pill-wrap">
      <button class="pill" data-key="start" aria-label="Старт / пауза"></button>
      <span>СТАРТ</span>
    </div>
  </div>

  <p class="hint">← → движение · ↑ поворот · ↓ ускорение · Enter старт/пауза · M звук</p>
</main>
<script src="game.js"></script>
</body>
</html>
